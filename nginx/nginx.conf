# nginx.conf — Proxy reverso Rinha de Backend 2026.
# least_conn entre api-1 e api-2 via Unix sockets, sem lógica de negócio.

events { worker_connections 1024; }

stream {
    upstream api_backends {
        least_conn;
        server unix:/run/sock/api-1.sock;
        server unix:/run/sock/api-2.sock;
    }

    server {
        listen 9999;
        proxy_pass api_backends;
    }
}
