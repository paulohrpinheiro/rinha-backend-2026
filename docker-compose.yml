volumes:
  sock:
    driver: local

services:
  proxy:
    image: paulohrpinheiro/rinha-proxy:v15
    ports:
      - "9999:9999"
    environment:
      - BACKENDS=http://api-1:8080,http://api-2:8080
      - PORT=9999
      - UNIX_SOCKET_DIR=/run/sock
    depends_on:
      api-1:
        condition: service_started
      api-2:
        condition: service_started
    networks:
      - rinha-net
    volumes:
      - sock:/run/sock
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20MB"

  api-1:
    hostname: api-1
    image: paulohrpinheiro/rinha-api:v15
    environment:
      - PORT=8080
      - RESOURCES_DIR=/resources
      - UNIX_SOCKET_DIR=/run/sock
    networks:
      - rinha-net
    volumes:
      - sock:/run/sock
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

  api-2:
    hostname: api-2
    image: paulohrpinheiro/rinha-api:v15
    environment:
      - PORT=8080
      - RESOURCES_DIR=/resources
      - UNIX_SOCKET_DIR=/run/sock
    networks:
      - rinha-net
    volumes:
      - sock:/run/sock
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

networks:
  rinha-net:
    driver: bridge
